name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.93.1 fmt --all -- --check
      - run: cargo +1.93.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.93.1 test --locked
